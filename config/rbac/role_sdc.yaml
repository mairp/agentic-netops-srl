# sdc-system: read the device-configuration layer's Targets and Schemas, and the running
# configuration it serves per Target (the read-back's written side). Nothing mutating.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: srl-provider-read
  namespace: sdc-system
  labels:
    app.kubernetes.io/name: srl-provider
rules:
- apiGroups: [config.sdcio.dev]
  resources: [targets]
  verbs: [get, list, watch]
- apiGroups: [config.sdcio.dev]
  resources: [runningconfigs]
  verbs: [get]
- apiGroups: [inv.sdcio.dev]
  resources: [schemas]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: srl-provider-read
  namespace: sdc-system
  labels:
    app.kubernetes.io/name: srl-provider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: srl-provider-read
subjects:
- kind: ServiceAccount
  name: srl-provider
  namespace: agentic-netops-system
