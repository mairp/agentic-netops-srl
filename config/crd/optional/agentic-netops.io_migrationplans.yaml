                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                required:
                - network
                type: object
              sourceVocabulary:
                description: SourceVocabulary is the alias it arrived as, recorded
                  beside the construct.
                enum:
                - VPLS
                - VPWS
                - L3VPN
                - L2L3-IRB
                type: string
              unsupportedFeatures:
                description: UnsupportedFeatures enumerates exact non-mappable semantics.
                items:
                  description: UnsupportedFeature is one exact non-mappable semantic.
                  properties:
                    code:
                      description: Code is a structured, stable code.
                      maxLength: 64
                      type: string
                    fieldPath:
                      description: FieldPath is the source field path.
                      maxLength: 256
                      type: string
                    message:
                      description: Message is a concise human-readable message.
                      maxLength: 1024
                      type: string
                  required:
                  - code
                  - fieldPath
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
