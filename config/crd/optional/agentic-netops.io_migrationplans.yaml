            properties:
              conditions:
                description: Conditions (Accepted, Translated, Ready, Degraded — data-model.md
                  §18).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              construct:
                description: Construct is the construct the service became.
                enum:
                - vlan
                - mac-vrf
                - ip-vrf
                - acl
                type: string
              generatedNetworkRef:
                description: |-
                  GeneratedNetworkRef is the Network the translator's output was applied as, recorded
                  once that object exists and validates; the controller never creates it.
                properties:
                  name:
                    description: Name of the Network; a DNS-1123 label.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  namespace:
                    description: Namespace of the Network; empty for the plan's own
                      namespace.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation the status reflects.
                format: int64
                type: integer
              perDevice:
                description: PerDevice is the aggregated rollout evidence.
                items:
                  description: PerDeviceStatus is one target's rollout evidence.
                  properties:
                    configRef:
                      description: ConfigRef is the Config name.
                      maxLength: 253
                      type: string
                    phase:
                      description: Phase of the target.
                      maxLength: 32
                      type: string
                    reason:
                      description: Reason code from the closed set.
                      maxLength: 64
                      type: string
                    target:
                      description: Target (node) name.
                      maxLength: 63
                      type: string
                  required:
                  - target
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              provenanceRef:
                description: ProvenanceRef references the Network's provenance annotations.
