                        minItems: 1
                        type: array
                        x-kubernetes-list-type: atomic
                      gateway:
                        description: Gateway addresses of the source service.
                        properties:
                          ipv4:
                            description: IPv4 gateway address with a prefix length.
                            maxLength: 18
                            type: string
                            x-kubernetes-validations:
                            - message: must be an IPv4 address with a prefix length
                              rule: isCIDR(self) && cidr(self).ip().family() == 4
                          ipv6:
                            description: IPv6 gateway address with a prefix length;
                              not link-local.
                            maxLength: 43
                            type: string
                            x-kubernetes-validations:
                            - message: must be a non-link-local IPv6 address with
                                a prefix length
                              rule: isCIDR(self) && cidr(self).ip().family() == 6
                                && !cidr(self).ip().isLinkLocalUnicast()
                        type: object
                      prefixes:
                        description: Prefixes the source service routes.
                        items:
                          description: MigrationPrefix is a CIDR prefix.
                          maxLength: 43
                          type: string
                          x-kubernetes-validations:
                          - message: must be a CIDR prefix
                            rule: isCIDR(self)
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: set
                      tenant:
                        description: Tenant of the service.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - endpoints
                    - tenant
                    type: object
                  platform:
                    description: Platform is the normalized legacy origin.
                    enum:
                    - legacy-router
                    type: string
                    x-kubernetes-validations:
                    - message: spec.source.platform is immutable once the MigrationPlan
                        is accepted
                      rule: self == oldSelf
                  serviceID:
                    description: ServiceID is the stable external correlation key;
                      immutable.
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]*$
                    type: string
                    x-kubernetes-validations:
                    - message: spec.source.serviceID is immutable once the MigrationPlan
                        is accepted
                      rule: self == oldSelf
                  serviceType:
                    description: ServiceType is the migration alias; selects an explicit
                      mapping onto a construct.
                    enum:
                    - VPLS
                    - VPWS
                    - L3VPN
                    - L2L3-IRB
                    type: string
                required:
                - normalizedIntent
                - platform
                - serviceID
                - serviceType
                type: object
              targetNetworkRef:
                description: TargetNetworkRef is the stable generated Network.
                properties:
                  name:
                    description: Name of the Network; a DNS-1123 label.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  namespace:
                    description: Namespace of the Network; empty for the plan's own
                      namespace.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
            required:
            - source
            - targetNetworkRef
            type: object
          status:
