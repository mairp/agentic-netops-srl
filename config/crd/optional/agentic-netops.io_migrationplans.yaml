---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: migrationplans.agentic-netops.io
spec:
  group: agentic-netops.io
  names:
    kind: MigrationPlan
    listKind: MigrationPlanList
    plural: migrationplans
    singular: migrationplan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.construct
      name: Construct
      type: string
    - jsonPath: .spec.targetNetworkRef.name
      name: Network
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Degraded")].status
      name: Degraded
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MigrationPlan is the optional migration record.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MigrationPlanSpec is the migration record's desired state.
            properties:
              mappingPolicy:
                description: MappingPolicy holds the explicit opt-ins.
                properties:
                  allowLimitedEquivalence:
                    default: false
                    description: |-
                      AllowLimitedEquivalence is the explicit opt-in for the point-to-point limited
                      equivalence.
                    type: boolean
                  cutover:
                    default: disabled
                    description: Cutover is manual or disabled; disabled by default.
                    enum:
                    - manual
                    - disabled
                    type: string
                type: object
              source:
                description: Source identifies and describes the source service.
                properties:
                  normalizedIntent:
                    description: NormalizedIntent is the structured source intent;
                      raw CLI is forbidden.
                    properties:
                      description:
                        description: Description of the source service.
                        maxLength: 256
                        type: string
                        x-kubernetes-validations:
                        - message: 'must be a single line: raw CLI or configuration
                            blobs are refused'
                          rule: '!self.matches(''[\n\r\t]'')'
                      endpoints:
                        description: Endpoints of the source service.
                        items:
                          description: MigrationEndpoint is a source attachment point
                            in normalized form.
                          properties:
                            attachment:
                              description: Attachment is the port in the device's
                                own naming.
                              maxLength: 32
                              minLength: 1
                              pattern: ^[a-z][a-z0-9-]*[0-9](/[0-9]+){0,2}$
                              type: string
                            node:
                              description: Node is the target leaf.
                              maxLength: 63
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
