---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: fabrics.fabric.agentic-netops.io
spec:
  group: fabric.agentic-netops.io
  names:
    categories:
    - agentic-netops
    kind: Fabric
    listKind: FabricList
    plural: fabrics
    singular: fabric
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.leaves
      name: Leaves
      type: integer
    - jsonPath: .status.spines
      name: Spines
      type: integer
    - jsonPath: .spec.overlay.fabricASN
      name: FabricASN
      type: integer
    - jsonPath: .status.allocated
      name: Allocated
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Degraded")].status
      name: Degraded
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Fabric is the fabric design.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FabricSpec is the fabric design.
            properties:
              inventory:
                description: Inventory of attachable and fabric ports per node (map
                  keyed by node).
                items:
                  description: InventoryEntry is one node's attachable (access) and
                    fabric-facing ports.
                  properties:
                    accessPorts:
                      description: AccessPorts are the only ports an attachment may
                        name; a spine has none.
                      items:
                        description: PortName is a port in the device's own naming,
                          e.g. ethernet-1/1.
                        maxLength: 32
                        minLength: 1
                        pattern: ^[a-z][a-z0-9-]*[0-9](/[0-9]+){0,2}$
                        type: string
                      maxItems: 128
                      type: array
                      x-kubernetes-list-type: set
                    fabricPorts:
                      description: FabricPorts are the fabric-facing ports.
                      items:
                        description: PortName is a port in the device's own naming,
                          e.g. ethernet-1/1.
                        maxLength: 32
                        minLength: 1
                        pattern: ^[a-z][a-z0-9-]*[0-9](/[0-9]+){0,2}$
                        type: string
                      maxItems: 128
                      type: array
                      x-kubernetes-list-type: set
                    node:
                      description: Node the entry describes; the map key.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    untaggedAccessPorts:
                      description: |-
                        UntaggedAccessPorts declares the access ports rendered vlan-tagging false; a subset of
                        accessPorts, empty by default. Every other access port is rendered vlan-tagging true
                        (AD-68).
                      items:
                        description: PortName is a port in the device's own naming,
                          e.g. ethernet-1/1.
                        maxLength: 32
                        minLength: 1
                        pattern: ^[a-z][a-z0-9-]*[0-9](/[0-9]+){0,2}$
                        type: string
                      maxItems: 128
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - node
                  type: object
                  x-kubernetes-validations:
                  - message: accessPorts and fabricPorts are disjoint
                    messageExpression: '''inventory '' + self.node + '': port '' +
                      self.accessPorts.filter(p, p in self.fabricPorts)[0] + '' is
                      listed in both accessPorts and fabricPorts; the lists are disjoint'''
                    rule: '!has(self.accessPorts) || !has(self.fabricPorts) || self.accessPorts.all(p,
                      !(p in self.fabricPorts))'
                  - message: untaggedAccessPorts must be a subset of the same entry's
                      accessPorts
                    messageExpression: '''inventory '' + self.node + '': untaggedAccessPorts
                      lists '' + self.untaggedAccessPorts.filter(p, !has(self.accessPorts)
                      || !(p in self.accessPorts))[0] + '', which is not one of its
                      accessPorts'''
                    rule: '!has(self.untaggedAccessPorts) || self.untaggedAccessPorts.all(p,
                      has(self.accessPorts) && p in self.accessPorts)'
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - node
                x-kubernetes-list-type: map
              maintenance:
                description: |-
                  Maintenance is the one declarative administrative-state knob: at most one entry per
                  (node, interface), each naming a port in the inventory.
                items:
                  description: MaintenanceEntry takes one inventory port out of service,
                    declaratively.
                  properties:
                    adminState:
                      description: AdminState rendered as /interface[name]/admin-state.
                      enum:
                      - disable
                      type: string
                    interface:
                      description: Interface is the port, access or fabric, as listed
                        in spec.inventory.
                      maxLength: 32
                      minLength: 1
                      pattern: ^[a-z][a-z0-9-]*[0-9](/[0-9]+){0,2}$
                      type: string
                    node:
                      description: Node of the port.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - adminState
                  - interface
                  - node
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - node
                - interface
                x-kubernetes-list-type: map
              mtu:
                description: MTU policy.
                properties:
                  bridgedL2MTU:
                    description: BridgedL2MTU is the bridged subinterface l2-mtu.
                    format: int32
                    maximum: 9500
                    minimum: 1450
                    type: integer
                  portMTU:
                    description: PortMTU is /interface[name]/mtu.
                    format: int32
                    maximum: 9500
                    minimum: 1500
                    type: integer
                  tenantIPMTU:
                    description: TenantIPMTU is portMTU − 64; also the endpoint interface
                      MTU.
                    format: int32
                    maximum: 9486
                    minimum: 1280
                    type: integer
                  underlayIPMTU:
                    description: UnderlayIPMTU is the routed subinterface ip-mtu.
                    format: int32
                    maximum: 9486
                    minimum: 1280
                    type: integer
                required:
                - bridgedL2MTU
                - portMTU
                - tenantIPMTU
                - underlayIPMTU
                type: object
                x-kubernetes-validations:
                - message: mtu.tenantIPMTU must equal mtu.portMTU - 64
                  rule: self.tenantIPMTU == self.portMTU - 64
              nodes:
                description: Nodes of the fabric; names unique (map keyed by name).
                items:
                  description: FabricNode is one device of the fabric.
                  properties:
                    asn:
                      description: |-
                        ASN is the underlay AS: unique per leaf, identical across spines; may be claimed from
                        underlay.asnPoolRef. Never the route-target AS.
                      format: int64
                      maximum: 4294967295
                      minimum: 1
                      type: integer
                    name:
                      description: Name of the node; a DNS-1123 label, the map key.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    platform:
                      description: Platform is a licence-free emulated type carrying
                        the full EVPN-VXLAN feature set.
                      enum:
                      - ixr-d2l
                      - ixr-d3l
                      type: string
                    role:
                      description: |-
                        Role decides what the fabric reconciler renders and what may carry an attachment.
                        Immutable once the Fabric is accepted.
                      enum:
                      - leaf
                      - spine
                      type: string
                      x-kubernetes-validations:
                      - message: spec.nodes[].role is immutable once the Fabric is
                          accepted
                        rule: self == oldSelf
                    routeReflector:
                      description: RouteReflector marks a route-reflecting spine.
                      type: boolean
                    systemIPv4:
                      description: |-
                        SystemIPv4 is the system loopback, a /32; may be omitted and claimed from
                        underlay.loopbackPoolRef.
                      maxLength: 18
                      type: string
                      x-kubernetes-validations:
                      - message: systemIPv4 must be an IPv4 /32
                        rule: isCIDR(self) && cidr(self).ip().family() == 4 && cidr(self).prefixLength()
                          == 32
                  required:
                  - name
                  - platform
                  - role
                  type: object
                  x-kubernetes-validations:
                  - message: routeReflector may be set only on a spine
                    rule: '!has(self.routeReflector) || !self.routeReflector || self.role
                      == ''spine'''
                maxItems: 32
                minItems: 2
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              overlay:
                description: Overlay constants.
                properties:
                  fabricASN:
                    description: FabricASN is the one constant every route target
                      is rendered from; immutable.
                    format: int64
                    maximum: 4294967295
                    minimum: 1
                    type: integer
                    x-kubernetes-validations:
                    - message: 'spec.overlay.fabricASN is immutable once the Fabric
                        is accepted: every route target is rendered from it'
                      rule: self == oldSelf
                  interASVPN:
                    description: |-
                      InterASVPN is rendered as inter-as-vpn on every reflecting spine; false is accepted —
                      the declarative way to withdraw reflection (AD-43).
                    type: boolean
                  routeReflectors:
                    description: RouteReflectors names the route-reflecting spines.
                    items:
                      description: |-
                        DNSLabel is a DNS-1123 label of at most 63 characters: lower-case alphanumerics and '-',
                        starting and ending with an alphanumeric, no dot. Entry names of vlans[], bridgeDomains[]
                        and routers[] are DNSLabels so that every claim name <namespace>.<name>.<role> is at most
                        63+1+63+1+6+63 = 197 of the 253 characters an object name allows (AD-56).
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: set
                  tunnelInterface:
                    default: vxlan0
                    description: TunnelInterface is the fabric constant vxlan0.
                    enum:
                    - vxlan0
                    type: string
                required:
                - fabricASN
                type: object
              underlay:
                description: Underlay addressing and ASN plan.
                properties:
                  addressFamilies:
                    description: AddressFamilies is a non-empty subset of ipv4, ipv6.
                    items:
                      description: AddressFamily is ipv4 or ipv6.
                      enum:
                      - ipv4
                      - ipv6
                      type: string
                    maxItems: 2
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  asnPoolRef:
                    description: ASNPoolRef is the index underlay AS numbers are claimed
                      from.
                    properties:
                      group:
                        description: Group of the index, e.g. ipam.be.kuid.dev.
                        maxLength: 253
                        minLength: 1
                        type: string
                      kind:
                        description: Kind of the index, e.g. IPIndex.
                        maxLength: 63
                        minLength: 1
                        type: string
                      name:
                        description: Name of the index.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the index.
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - group
                    - kind
                    - name
                    - namespace
                    type: object
                  linkPoolRef:
                    description: LinkPoolRef is the index point-to-point link prefixes
                      are claimed from.
                    properties:
                      group:
                        description: Group of the index, e.g. ipam.be.kuid.dev.
                        maxLength: 253
                        minLength: 1
                        type: string
                      kind:
                        description: Kind of the index, e.g. IPIndex.
                        maxLength: 63
                        minLength: 1
                        type: string
                      name:
                        description: Name of the index.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the index.
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - group
                    - kind
                    - name
                    - namespace
                    type: object
                  loopbackPoolRef:
                    description: LoopbackPoolRef is the index system loopbacks are
                      claimed from.
                    properties:
                      group:
                        description: Group of the index, e.g. ipam.be.kuid.dev.
                        maxLength: 253
                        minLength: 1
                        type: string
                      kind:
                        description: Kind of the index, e.g. IPIndex.
                        maxLength: 63
                        minLength: 1
                        type: string
                      name:
                        description: Name of the index.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the index.
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - group
                    - kind
                    - name
                    - namespace
                    type: object
                required:
                - addressFamilies
                type: object
            required:
            - inventory
            - mtu
            - nodes
            - overlay
            - underlay
            type: object
            x-kubernetes-validations:
            - message: a Fabric has at least one leaf and one spine
              rule: self.nodes.exists(n, n.role == 'leaf') && self.nodes.exists(n,
                n.role == 'spine')
            - message: every node needs a systemIPv4 /32 unless underlay.loopbackPoolRef
                is set
              rule: has(self.underlay.loopbackPoolRef) || self.nodes.all(n, has(n.systemIPv4))
            - message: systemIPv4 is unique across nodes
              rule: self.nodes.all(n, !has(n.systemIPv4) || self.nodes.exists_one(o,
                has(o.systemIPv4) && o.systemIPv4 == n.systemIPv4))
            - message: every node needs an asn unless underlay.asnPoolRef is set
              rule: has(self.underlay.asnPoolRef) || self.nodes.all(n, has(n.asn))
            - message: the underlay asn is unique per leaf
              rule: self.nodes.all(n, n.role != 'leaf' || !has(n.asn) || self.nodes.exists_one(o,
                has(o.asn) && o.asn == n.asn))
            - message: the underlay asn is shared across spines
              rule: self.nodes.all(n, n.role != 'spine' || !has(n.asn) || self.nodes.all(o,
                o.role != 'spine' || !has(o.asn) || o.asn == n.asn))
            - message: overlay.routeReflectors names spines of spec.nodes
              rule: '!has(self.overlay.routeReflectors) || self.overlay.routeReflectors.all(r,
                self.nodes.exists(n, n.name == r && n.role == ''spine''))'
            - message: every inventory entry names a node of spec.nodes
              messageExpression: '''inventory names node '' + self.inventory.map(i,
                i.node).filter(x, !self.nodes.exists(n, n.name == x))[0] + '', which
                is not in spec.nodes'''
              rule: self.inventory.all(i, self.nodes.exists(n, n.name == i.node))
            - message: a spine inventory entry has no access ports
              rule: self.inventory.all(i, !has(i.accessPorts) || size(i.accessPorts)
                == 0 || !self.nodes.exists(n, n.name == i.node && n.role == 'spine'))
            - message: every maintenance entry names a port of spec.inventory
              messageExpression: '''maintenance names '' + self.maintenance.map(m,
                self.inventory.exists(i, i.node == m.node && ((has(i.accessPorts)
                && m.interface in i.accessPorts) || (has(i.fabricPorts) && m.interface
                in i.fabricPorts))) ? ''-'' : m.node + '' '' + m.interface).filter(x,
                x != ''-'')[0] + '', which is not a port of spec.inventory'''
              rule: '!has(self.maintenance) || self.maintenance.all(m, self.inventory.exists(i,
                i.node == m.node && ((has(i.accessPorts) && m.interface in i.accessPorts)
                || (has(i.fabricPorts) && m.interface in i.fabricPorts))))'
          status:
            description: FabricStatus is the observed state of a Fabric.
            properties:
              allocated:
                description: Allocated summarises the underlay claims as bound/total
                  (printer column).
                maxLength: 32
                type: string
              allocations:
                description: Allocations are claim references for every loopback,
                  link prefix and ASN.
                items:
                  description: |-
                    AllocationRef is a claim reference for a loopback, link prefix or ASN the Fabric reconciler
                    claimed.
                  properties:
                    bound:
                      description: Bound is true once the claim reports its value.
                      type: boolean
                    indexKind:
                      description: IndexKind is ipam or as.
                      enum:
                      - ipam
                      - as
                      type: string
                    name:
                      description: Name of the claim.
                      maxLength: 253
                      type: string
                    namespace:
                      description: Namespace of the claim.
                      maxLength: 63
                      type: string
                    node:
                      description: Node the value belongs to, when per node.
                      maxLength: 63
                      type: string
                    purpose:
                      description: Purpose says what the value is for, e.g. loopback,
                        link, asn.
                      maxLength: 63
                      type: string
                    value:
                      description: Value reported by the claim, as text (an address,
                        prefix or AS number).
                      maxLength: 64
                      type: string
                  required:
                  - indexKind
                  - name
                  - namespace
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: Conditions are the standard conditions of data-model.md
                  §18.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              findings:
                description: Findings are the durable force-release records (FR-103).
                items:
                  description: Finding is the durable record of a force-release (FR-103,
                    data-model.md §3a).
                  properties:
                    deviceObjects:
                      description: DeviceObjects are the object names the service
                        had rendered on that node.
                      items:
                        type: string
                      maxItems: 64
                      type: array
                      x-kubernetes-list-type: atomic
                    identifiers:
                      description: Identifiers released without a read-back.
                      items:
                        description: ReleasedIdentifier is an allocation released
                          without a read-back.
                        properties:
                          index:
                            description: Index the identifier was drawn from.
                            maxLength: 253
                            type: string
                          kind:
                            description: Kind of identifier, e.g. vlan, l2vni, l3vni.
                            maxLength: 32
                            type: string
                          value:
                            description: Value of the identifier.
                            maxLength: 64
                            type: string
                        required:
                        - kind
                        - value
                        type: object
                      maxItems: 16
                      type: array
                      x-kubernetes-list-type: atomic
                    node:
                      description: Node is the device that was unreachable.
                      maxLength: 63
                      type: string
                    reason:
                      description: Reason is the operator's stated reason, copied
                        from the annotation.
                      maxLength: 1024
                      type: string
                    recordedAt:
                      description: RecordedAt is when the finding was appended.
                      format: date-time
                      type: string
                    service:
                      description: Service is the force-released Network.
                      properties:
                        name:
                          maxLength: 63
                          type: string
                        namespace:
                          maxLength: 63
                          type: string
                        uid:
                          maxLength: 64
                          type: string
                      required:
                      - name
                      - namespace
                      - uid
                      type: object
                    type:
                      description: Type of the finding.
                      enum:
                      - StaleConfigurationPossible
                      type: string
                  required:
                  - node
                  - reason
                  - recordedAt
                  - service
                  - type
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              lastVerifiedTime:
                description: LastVerifiedTime is the last scheduled re-verification
                  that ran (FR-107, AD-54).
                format: date-time
                type: string
              leaves:
                description: Leaves is the number of leaf nodes (printer column).
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the generation the status reflects.
                format: int64
                type: integer
              renderedConfigs:
                description: RenderedConfigs are the per-node priority-10 Configs
                  with render hash and phase.
                items:
                  description: |-
                    RenderedConfig is the reference to one generated device-configuration resource (the
                    device-configuration layer's own Config, named <source>.<node>) with its render hash and the
                    target's current phase and reason (contracts/crd-api.md §Status contract).
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is when Phase last changed.
                      format: date-time
                      type: string
                    message:
                      description: Message is a concise human-readable message; automation
                        keys on Reason.
                      maxLength: 2048
                      type: string
                    name:
                      description: Name of the Config — <source>.<node>.
                      maxLength: 253
                      type: string
                    namespace:
                      description: Namespace of the Config — agentic-netops-system,
                        always.
                      maxLength: 63
                      type: string
                    node:
                      description: Node is the target the Config binds to.
                      maxLength: 63
                      type: string
                    observedGeneration:
                      description: ObservedGeneration is the source generation this
                        entry was rendered from.
                      format: int64
                      type: integer
                    phase:
                      description: Phase is the target's current phase.
                      maxLength: 32
                      type: string
                    priority:
                      description: 'Priority of the Config: 10 for the Fabric-derived
                        per-node Config, 20 per service.'
                      format: int32
                      type: integer
                    reason:
                      description: Reason is a stable reason code from the closed
                        set of data-model.md §18.
                      maxLength: 64
                      type: string
                    renderHash:
                      description: RenderHash is the canonical render hash the Config
                        carries, sha256:<hex>.
                      maxLength: 80
                      type: string
                    transactionRef:
                      description: TransactionRef is the last device transaction reference,
                        when available.
                      maxLength: 253
                      type: string
                  required:
                  - name
                  - namespace
                  - node
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              spines:
                description: Spines is the number of spine nodes (printer column).
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name must not contain a dot: the generated Config name
            <source>.<node> is parsed on the last dot'
          rule: '!self.metadata.name.contains(''.'')'
        - message: metadata.name must be a DNS-1123 label of at most 63 characters
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
