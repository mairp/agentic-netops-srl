# The exemplar of contracts/network-spec.md §6: a mac-vrf with an anycast gateway and an ingress
# access list. VLAN 100 named; L2VNI 10021 and L3VNI 10022 from the allocation authority;
# route targets derived as target:<fabricASN>:<vni> with fabricASN 65000.
apiVersion: fabric.agentic-netops.io/v1alpha1
kind: Network
metadata:
  name: migr-4b7e19c2a05d3f6
  namespace: agentic-netops-intent
  labels:
