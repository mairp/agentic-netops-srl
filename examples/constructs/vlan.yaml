# A vlan (the local broadcast domain): VLAN 110, named from the naming band 100–999 (AD-33), on
# leaf01 ethernet-1/1. Applied with cluster tooling into agentic-netops-services — never the
# intent tier's namespace (AD-26). No claim is shipped and none is needed: a vlan has no VNI and
# a naming-band VLAN is never claimed (FR-109, AD-33). See README.md for the device objects.
apiVersion: fabric.agentic-netops.io/v1alpha1
kind: Network
metadata:
  name: lab-vlan
  namespace: agentic-netops-services
spec:
  description: lab vlan 110 on leaf01 ethernet-1/1
  vlans:
  - name: v110
    vlan: 110
  attachments:
  - {node: leaf01, attachment: ethernet-1/1, vlan: 110}
