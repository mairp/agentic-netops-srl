# deploy/agents — the intent tier's workloads (T082, T087), applied by the tier phase of provisioning
# (scripts/lib/intent_tier.sh) into agentic-netops-agents AFTER the safety boundary of deploy/rbac/
# (namespaces, ServiceAccounts, Roles, the four NetworkPolicies — T068–T071) is in place and proven.
# The tier phase applies the pieces in order — the store and its collector first and waited Ready
# (AD-45), then the transport, then the agents; `kubectl apply -k deploy/agents` applies everything
# (idempotent) and is what the resources list below is for.
#
# Not shipped here, on purpose — each is generated or copied by the tier phase and has no literal:
# Secrets slim-gateway, clickhouse-auth, llm-provider, operator-credentials (T072's generator), and
# ConfigMaps site-inventory (from the Fabric inventory) and fabric-qualification (copied from
# agentic-netops-system).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentic-netops-agents
resources:
  - clickhouse.yaml
  - agent-otel-collector.yaml
  - networkpolicies-workloads.yaml
  - slim.yaml
  - supervisor.yaml
  - mapper.yaml
  - allocator.yaml
  - deployer.yaml
  - mapper-catalogue.yaml
  - supervisor-prompts.yaml
# The worker cards the supervisor discovers at call time (FR-071): one JSON card per file, each equal to
# `python -m provisioning.<worker>.card` (a unit test asserts it). A fixed name — the supervisor mounts
# ConfigMap agent-cards — so no suffix hash.
configMapGenerator:
  - name: agent-cards
    files:
      - cards/mapper.json
      - cards/allocator.json
      - cards/deployer.json
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: agent-cards
        app.kubernetes.io/part-of: agentic-netops-intent-tier
# The four agent images are built locally and never pulled: scripts/lib/image_build.sh (T169) writes
# each content-hash tag into newTag below (a kustomize image override, never a hand edit). Until a
# build has, newTag is the 64-zero sentinel no build carries, so an unbuilt deployment fails visibly
# (ErrImageNeverPull) — never `latest`.
images:
  - name: supervisor
    newTag: "ccbd5616c436721c27b641db04275f99003eb024f0fbf3c8568df3eb097c576e"
  - name: mapper
    newTag: "e3e13eaa9c957ba6a19b6cb75f087201d6d19d897eb8d1a7edf91c1f0589caa5"
  - name: allocator
    newTag: "b56b8edfa8a8c05c5a011edc7194381fd0d14ce659e3d9ccb53a03e0f82053b4"
  - name: deployer
    newTag: "0fdc8ec65bae84edb8bb45e20a2c44cb64528b044fba8b56ac871597b3e45012"
  - name: intent-translator
    newTag: "d0baddcfbcf69e74608d70a3a889d50e795622381066f2f523d80997085ccc67"
