# provenance: source=first-party version=v0.1.0
# The conversation-trace panel of the intent-tier dashboard (T137; FR-095, R-19): Grafana in
# monitoring reads the analytics store through ClickHouse's MySQL wire port (9004/TCP) with the
# built-in MySQL datasource agent-analytics (Secret monitoring/grafana-agents-datasource, generated
# from clickhouse-auth at tier install — no credential here). The MySQL wire, not the PostgreSQL one
# (9005): the pinned Grafana's PostgreSQL health check sends an empty query ClickHouse refuses, so
# that datasource reports ERROR although its queries answer (evidence: phase13/t137-live.txt).
# One port, one workload, one peer: the grafana pods of the monitoring namespace. Tier-owned: removed
# with agentic-netops-agents by `off.sh --purge-intent-tier`. Additive only — it widens no denial of US6.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-grafana-analytics-ingress
  namespace: agentic-netops-agents
  labels:
    app.kubernetes.io/part-of: agentic-netops-intent-tier
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
    ports:
    - protocol: TCP
      port: 9004
