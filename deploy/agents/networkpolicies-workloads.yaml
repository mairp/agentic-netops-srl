# provenance: source=first-party version=v0.1.0
# The ingress allowances the intent tier's workloads need beyond the four US6 policies
# (deploy/rbac/networkpolicies.yaml — deny-all-by-default, allow-egress-scoped, slim-ingress,
# apiserver-egress-cluster-clients), which are not modified (T087; FR-075). Each admits one port to
# one workload from the narrowest peer set that uses it; egress is untouched but for the tier
# collector's forward (allow-egress-scoped already admits pod-to-pod traffic inside
# agentic-netops-agents and nothing toward the management CIDR). NetworkPolicies are additive
# allowances, so none of these can widen a denial of US6.
#
#   agent-otel-collector-ingress  4318/TCP (OTLP/HTTP) from tier-labelled pods — every agent emits once;
#                                 8888/TCP (the collector's own telemetry) from the monitoring
#                                 namespace's Prometheus only (job agent-otel-collector, T136)
#   agent-otel-collector-egress-fabric
#                                 the one egress allowance: 4317/TCP (OTLP/gRPC) from the tier collector
#                                 to the fabric collector's pods in monitoring — the otlp/fabric forward
#                                 (T136). allow-egress-scoped excludes the pod and service CIDRs, so
#                                 without it the forward has no path; DNS stays allow-egress-scoped's
#   clickhouse-ingress            8123/TCP and 9000/TCP from the tier collector only; the audit
#                                 export reads the store through `kubectl exec`, never the network
#   supervisor-ingress            9090/TCP from anywhere: the operator reaches the supervisor through
#                                 the Kind port mapping 127.0.0.1:19090 → NodePort 30990, and the
#                                 supervisor authenticates every pipeline-reaching route itself (FR-102)
#   ui-ingress                    3000/TCP from anywhere: the operator reaches the chat surface through
#                                 the Kind port mapping 127.0.0.1:13000 → NodePort 30300 (T126); the ui
#                                 holds no credential and its /api proxy reaches only the supervisor,
#                                 whose 9090 supervisor-ingress already admits (egress: allow-egress-scoped
#                                 admits pod-to-pod inside agentic-netops-agents and the cluster DNS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-otel-collector-ingress
  namespace: agentic-netops-agents
  labels:
    app.kubernetes.io/part-of: agentic-netops-intent-tier
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-otel-collector
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          agentic-netops.io/tier: intent
    ports:
    - protocol: TCP
      port: 4318
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8888
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-otel-collector-egress-fabric
  namespace: agentic-netops-agents
  labels:
    app.kubernetes.io/part-of: agentic-netops-intent-tier
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-otel-collector
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: device-metrics-otel
    ports:
    - protocol: TCP
      port: 4317
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-ingress
  namespace: agentic-netops-agents
  labels:
    app.kubernetes.io/part-of: agentic-netops-intent-tier
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: agent-otel-collector
    ports:
    - protocol: TCP
      port: 8123
    - protocol: TCP
      port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: supervisor-ingress
  namespace: agentic-netops-agents
  labels:
    app.kubernetes.io/part-of: agentic-netops-intent-tier
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: supervisor
  policyTypes: [Ingress]
  ingress:
  - ports:
    - protocol: TCP
      port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-ingress
  namespace: agentic-netops-agents
  labels:
    app.kubernetes.io/part-of: agentic-netops-intent-tier
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ui
  policyTypes: [Ingress]
  ingress:
  - ports:
    - protocol: TCP
      port: 3000
