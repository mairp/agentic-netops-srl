# intent-secret-generator — the intent tier's in-cluster secret generator (T072; FR-106, FR-102,
# FR-079, FR-019, CR-008, SC-048, AD-01, AD-67; contracts/kubernetes-objects.md "Job
# intent-secret-generator").
#
# It reuses the lifecycle's generator pattern by running the SAME code: the container executes
# scripts/lib/intent_secrets.sh (with log.sh and ownership.sh), mounted read-only from the ConfigMap
# `intent-secret-generator-scripts` that `intent_secrets.sh scripts-configmap` renders byte-for-byte
# from the repository. So the Job's merge, its gateway refusal and the redaction on the line naming
# the endpoint (intent_secrets::redact_url — userinfo → `***@`, a credential query parameter →
# `name=***`) are the script's, not a copy (AD-67); tests/unit/lifecycle/intent_secrets_test.sh runs
# this container's command as declared here against a fake API and asserts that line redacted.
#
# Inputs: the AGENTIC_NETOPS_LLM_* values come from the transient Secret
# `intent-secret-generator-input` (`intent_secrets.sh input-secret` renders it from the caller's
# environment, omitting unset keys), each through an OPTIONAL secretKeyRef — an absent key is an
# absent input and the merge keeps the stored value. No credential is written in this file
# (FR-019, CR-008); the operator password is always generated in the pod (FR-102).
#
# Identity: its own ServiceAccount — none of the five tier identities — bound by a Role in
# agentic-netops-agents ONLY: get/patch on the four generated Secrets by name, create on Secrets
# (a create cannot be narrowed by name). No list, watch or delete; nothing cluster-scoped.
#
# Image: the Kind node image pinned in versions.lock.yaml (platform.kind.nodeImage) — the one pinned
# image that carries bash, kubectl, jq and openssl. It is already on the host (the cluster runs on
# it) and is loaded into the cluster before this Job runs. The ownership label value below is the
# default cluster name; the lifecycle re-labels it with --cluster-name (scripts/lib/ownership.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-secret-generator
  namespace: agentic-netops-agents
  labels:
    agentic-netops.io/owned-by: agentic-netops
    app.kubernetes.io/part-of: agentic-netops
    agentic-netops.io/component: intent-secret-generator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: intent-secret-generator
  namespace: agentic-netops-agents
  labels:
    agentic-netops.io/owned-by: agentic-netops
    app.kubernetes.io/part-of: agentic-netops
    agentic-netops.io/component: intent-secret-generator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["llm-provider", "operator-credentials", "slim-gateway", "clickhouse-auth"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intent-secret-generator
  namespace: agentic-netops-agents
  labels:
    agentic-netops.io/owned-by: agentic-netops
    app.kubernetes.io/part-of: agentic-netops
    agentic-netops.io/component: intent-secret-generator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: intent-secret-generator
subjects:
  - kind: ServiceAccount
    name: intent-secret-generator
    namespace: agentic-netops-agents
---
apiVersion: batch/v1
kind: Job
metadata:
  name: intent-secret-generator
  namespace: agentic-netops-agents
  labels:
    agentic-netops.io/owned-by: agentic-netops
    app.kubernetes.io/part-of: agentic-netops
    agentic-netops.io/component: intent-secret-generator
spec:
  backoffLimit: 0 # a refusal (a declared gateway without a base URL) is final, never retried
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        agentic-netops.io/owned-by: agentic-netops
        agentic-netops.io/component: intent-secret-generator
    spec:
      serviceAccountName: intent-secret-generator
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: "docker.io/kindest/node:v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f"
          imagePullPolicy: IfNotPresent
          command: ["bash", "/opt/intent-secret-generator/intent_secrets.sh", "ensure"]
          env:
            - name: AGENTIC_NETOPS_GENERATOR_IN_CLUSTER
              value: "1"
            - name: CLUSTER_NAME
              value: agentic-netops
            - name: HOME
              value: /tmp
            - name: AGENTIC_NETOPS_LLM_MODEL
              valueFrom:
                secretKeyRef: {name: intent-secret-generator-input, key: AGENTIC_NETOPS_LLM_MODEL, optional: true}
            - name: AGENTIC_NETOPS_LLM_API_KEY
              valueFrom:
                secretKeyRef: {name: intent-secret-generator-input, key: AGENTIC_NETOPS_LLM_API_KEY, optional: true}
            - name: AGENTIC_NETOPS_LLM_BASE_URL
              valueFrom:
                secretKeyRef: {name: intent-secret-generator-input, key: AGENTIC_NETOPS_LLM_BASE_URL, optional: true}
            - name: AGENTIC_NETOPS_LLM_GATEWAY
              valueFrom:
                secretKeyRef: {name: intent-secret-generator-input, key: AGENTIC_NETOPS_LLM_GATEWAY, optional: true}
            - name: AGENTIC_NETOPS_LLM_BASE_URL_CLEAR
              valueFrom:
                secretKeyRef: {name: intent-secret-generator-input, key: AGENTIC_NETOPS_LLM_BASE_URL_CLEAR, optional: true}
            - name: OPERATOR_USERNAME
              valueFrom:
                secretKeyRef: {name: intent-secret-generator-input, key: OPERATOR_USERNAME, optional: true}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /opt/intent-secret-generator
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: intent-secret-generator-scripts
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
