# The intent tier's ServiceAccounts (T068; FR-075; contracts/kubernetes-objects.md §"Identity
# contract"). Exactly two of them are cluster API identities, and only those two mount a token:
#
#   intent-deployer   the service-intent writer (Role intent-writer, deploy/rbac/roles.yaml)
#   intent-allocator  claim-only (Role kuid-claimer, deploy/rbac/claims/<authority>/role.yaml,
#                     selected by versions.lock.yaml's allocationAuthority.kind)
#
# The supervisor, the mapper and the UI hold no cluster permission and have NO token mounted: an
# agent compromised by prompt injection in one of them has no credential to present to the API
# server at all. The supervisor reads operator-credentials from a read-only volume, never the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-supervisor
  namespace: agentic-netops-agents
  labels:
    app.kubernetes.io/part-of: agentic-netops-intent-tier
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-mapper
  namespace: agentic-netops-agents
  labels:
    app.kubernetes.io/part-of: agentic-netops-intent-tier
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-ui
  namespace: agentic-netops-agents
  labels:
    app.kubernetes.io/part-of: agentic-netops-intent-tier
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-allocator
  namespace: agentic-netops-agents
  labels:
    app.kubernetes.io/part-of: agentic-netops-intent-tier
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-deployer
  namespace: agentic-netops-agents
  labels:
    app.kubernetes.io/part-of: agentic-netops-intent-tier
automountServiceAccountToken: true
