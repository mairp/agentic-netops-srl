# deploy/allocation/pools — the first-party allocation authority's seed pools (T179; FR-012,
# FR-104, AD-33, AD-10; contracts/kuid-claim-profiles.md §1, §7). Applied by scripts/provision.sh
# only under allocationAuthority.kind: first-party, once the IdentifierPool/IdentifierClaim CRDs
# are established, the authority is rolled out and gate item G11 has passed:
#   kubectl apply --server-side -k deploy/allocation/pools
# Every file is GENERATED by `scripts/lib/inventory.sh --pools` from deploy/kuid/indices — the
# same names and exactly the same ranges as the kuid indices; never edited by hand:
# ipam.yaml   fabric01-loopback (ip 10.0.0.0/24), fabric01-p2p (ip 10.1.0.0/24)
# as.yaml     fabric01-underlay (asn 65100–65199)
# vlan.yaml   fabric01-vlan (vlan 1000–4000; the naming band 100–999 is outside every pool)
# vni.yaml    fabric01-vni (vni 10000–20000)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentic-netops-allocation
resources:
- ipam.yaml
- as.yaml
- vlan.yaml
- vni.yaml
