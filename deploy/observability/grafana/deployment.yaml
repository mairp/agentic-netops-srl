# Grafana, the dashboards of the observability stack (T130, T132; FR-087, FR-088, FR-094, FR-096).
#
# Access (FR-096): no anonymous access, no sign-up, and never the image's default administrator —
# the administrator is monitoring/grafana-admin (admin-user, admin-password), generated by
# scripts/lib/lab_secrets.sh (T037) and read here through secretKeyRef: never a literal. The
# database is an emptyDir, so every start creates the administrator afresh from that Secret.
#
# Nothing is fetched at run time (FR-094, SC-017b): no GF_INSTALL_PLUGINS, plugin preinstall,
# update checks, usage reporting and the news feed are off. The one plugin,
# andrewbmchugh-flow-panel 1.20.1, is the vendored release package
# (vendor/andrewbmchugh-flow-panel-1.20.1.zip) served from the chunk ConfigMaps
# grafana-plugin-flow-panel-<n> that scripts/lib/grafana_assets.sh writes (a ConfigMap holds at most
# 1 MiB): the init container concatenates the chunks, checks the result against the digest
# versions.lock.yaml records (ConfigMap grafana-plugin-flow-panel-lock, rendered from the lock file
# by the same script) and unpacks it into the plugin directory. Its community signature is checked by
# Grafana as usual. The chunk list below is the one grafana_assets.sh renders for that package
# (tests/unit/grafana/grafana_test.sh holds the two equal).
#
# Provisioning: datasource Prometheus (uid prometheus) and the file dashboard provider
# (provisioning.yaml); the dashboards are the ConfigMaps grafana-dashboard-<name> that
# grafana_assets.sh renders from dashboards/*.json (series names from series.json, the topology
# view's SVG and panel YAML from the generated topology assets of T131).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: agentic-netops}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: agentic-netops}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 0
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: flow-panel
        image: docker.io/grafana/grafana
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-ec"]
        args:
        - |
          cat /plugin-chunks/andrewbmchugh-flow-panel.zip.part-* > /var/lib/grafana/flow-panel.zip
          echo "${FLOW_PANEL_SHA256}  /var/lib/grafana/flow-panel.zip" | sha256sum -c -
          rm -rf /var/lib/grafana/plugins/andrewbmchugh-flow-panel
          mkdir -p /var/lib/grafana/plugins
          unzip -q /var/lib/grafana/flow-panel.zip -d /var/lib/grafana/plugins
          rm -f /var/lib/grafana/flow-panel.zip
          grep -q '"version": "'"${FLOW_PANEL_VERSION}"'"' /var/lib/grafana/plugins/andrewbmchugh-flow-panel/plugin.json
        env:
        - name: FLOW_PANEL_SHA256
          valueFrom: {configMapKeyRef: {name: grafana-plugin-flow-panel-lock, key: sha256}}
        - name: FLOW_PANEL_VERSION
          valueFrom: {configMapKeyRef: {name: grafana-plugin-flow-panel-lock, key: version}}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: data, mountPath: /var/lib/grafana}
        - {name: plugin-chunks, mountPath: /plugin-chunks, readOnly: true}
      containers:
      - name: grafana
        image: docker.io/grafana/grafana
        imagePullPolicy: IfNotPresent
        ports:
        - {name: http, containerPort: 3000}
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-user}}
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-password}}
        - {name: GF_SECURITY_DISABLE_GRAVATAR, value: "true"}
        - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
        - {name: GF_AUTH_BASIC_ENABLED, value: "true"}
        - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "false"}
        - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
        - {name: GF_USERS_ALLOW_ORG_CREATE, value: "false"}
        - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
        - {name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED, value: "false"}
        - {name: GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED, value: "true"}
        - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
        - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
        - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
        - {name: GF_ANALYTICS_FEEDBACK_LINKS_ENABLED, value: "false"}
        - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
        - {name: GF_SNAPSHOTS_EXTERNAL_ENABLED, value: "false"}
        - {name: GF_LOG_MODE, value: console}
        readinessProbe:
          httpGet: {path: /api/health, port: http}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /api/health, port: http}
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: data, mountPath: /var/lib/grafana}
        - {name: tmp, mountPath: /tmp}
        - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
        - {name: dashboard-providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
        - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
      - {name: data, emptyDir: {}}
      - {name: tmp, emptyDir: {}}
      - {name: datasources, configMap: {name: grafana-datasources}}
      - {name: dashboard-providers, configMap: {name: grafana-dashboard-providers}}
      - name: dashboards
        projected:
          sources:
          - configMap: {name: grafana-dashboard-collector-health}
          - configMap: {name: grafana-dashboard-evpn-service-path}
          - configMap: {name: grafana-dashboard-fabric}
          - configMap: {name: grafana-dashboard-orchestration}
          - configMap: {name: grafana-dashboard-physical-topology}
      - name: plugin-chunks
        projected:
          sources:
          - configMap: {name: grafana-plugin-flow-panel-0}
          - configMap: {name: grafana-plugin-flow-panel-1}
          - configMap: {name: grafana-plugin-flow-panel-2}
          - configMap: {name: grafana-plugin-flow-panel-3}
          - configMap: {name: grafana-plugin-flow-panel-4}
          - configMap: {name: grafana-plugin-flow-panel-5}
