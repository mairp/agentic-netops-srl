# Grafana provisioning (T130, T132; FR-088, FR-094): the one datasource — the in-cluster Prometheus
# (T130), uid `prometheus`, which every dashboard names — and the file provider that loads the
# dashboards mounted at /var/lib/grafana/dashboards (the ConfigMaps grafana-dashboard-<name>
# rendered by scripts/lib/grafana_assets.sh). Provisioned objects are read-only in the UI: the
# repository is their source.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: agentic-netops}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 10s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: monitoring
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: agentic-netops}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: agentic-netops
        orgId: 1
        folder: Agentic NetOps
        folderUid: agentic-netops
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
