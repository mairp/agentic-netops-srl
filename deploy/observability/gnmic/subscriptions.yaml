subscriptions:
  device-counters:
    mode: stream
    stream-mode: sample
    sample-interval: 10s
    paths:
      - "/interface[name=*]/traffic-rate"
      - "/interface[name=*]/statistics"
      - "/interface[name=*]/subinterface[index=*]/statistics"
      - "/network-instance[name=default]/protocols/bgp/neighbor[peer-address=*]/afi-safi[afi-safi-name=*]/active-routes"
