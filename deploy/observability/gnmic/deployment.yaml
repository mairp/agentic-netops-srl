# gNMIc, the device metric collector's device client (T129; FR-086, FR-089, AD-55, AD-82). Its
# configuration — targets rendered for MGMT_CIDR, subscriptions, the native `type: otlp` output and
# its event processors, the TLS profile and the api-server — is the ConfigMap device-metrics-gnmic
# written by scripts/lib/device_metrics.sh. The credentials are the collector's own copy,
# monitoring/srl-credentials (scripts/lib/lab_secrets.sh, T037): the username and password through
# secretKeyRef, and the containerlab CA (key ca.crt) mounted read-only at /etc/gnmic-tls/ca.crt, the
# `tls-ca` the rendered configuration verifies the devices' gNMI server (57400) against — never a
# literal. Its own /metrics (api-server :7890, enable-metrics) is exposed as port `metrics` and
# scraped through Service gnmic-self as job `gnmic-self` (service.yaml; data-model.md §21).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-metrics-gnmic
  namespace: monitoring
  labels: {app.kubernetes.io/name: device-metrics-gnmic, app.kubernetes.io/part-of: agentic-netops}
spec:
  replicas: 1
  strategy: {type: Recreate}   # never two collectors holding device sessions at once (FR-086)
  selector:
    matchLabels: {app.kubernetes.io/name: device-metrics-gnmic}
  template:
    metadata:
      labels: {app.kubernetes.io/name: device-metrics-gnmic, app.kubernetes.io/part-of: agentic-netops}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: gnmic
        image: ghcr.io/openconfig/gnmic
        imagePullPolicy: IfNotPresent
        args: ["--config", "/etc/gnmic/gnmic.yaml", "subscribe"]
        env:
        - name: GNMIC_USERNAME
          valueFrom: {secretKeyRef: {name: srl-credentials, key: username}}
        - name: GNMIC_PASSWORD
          valueFrom: {secretKeyRef: {name: srl-credentials, key: password}}
        ports:
        - {name: metrics, containerPort: 7890}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 500m, memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: cfg, mountPath: /etc/gnmic, readOnly: true}
        - {name: tls, mountPath: /etc/gnmic-tls, readOnly: true}
      volumes:
      - {name: cfg, configMap: {name: device-metrics-gnmic}}
      - name: tls
        secret:
          secretName: srl-credentials
          defaultMode: 0444
          items: [{key: ca.crt, path: ca.crt}]
