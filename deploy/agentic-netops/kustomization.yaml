# deploy/agentic-netops — the first-party control plane (T042), applied by the lifecycle with
# `kubectl apply --server-side -k deploy/agentic-netops`: the namespaces agentic-netops-system
# and agentic-netops-services, the first-party CRDs (config/crd), the provider's
# least-privilege identity (config/rbac), its Deployment, and the Network validating webhook
# (webhook.yaml, T061: its cert-manager-issued serving certificate, Service and
# ValidatingWebhookConfiguration).
#
# Not shipped here, on purpose: the ConfigMap srl-provider-settings. Its `drift-policy` key
# has no default and is written by scripts/provision.sh (lab: `revertive`); a production
# deployment states the same value itself (FR-015, AD-34). Without it the Pod does not start.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - ../../config/crd
  - ../../config/rbac
  - deployment.yaml
  - service.yaml
  - webhook.yaml
# The provider image is built locally and never pulled: scripts/lib/image_build.sh (T169)
# writes its content-hash tag into newTag below (a kustomize image override, never a hand
# edit). Until it has, newTag is the placeholder `unbuilt`, which no registry and no local
# build carries, so an unbuilt deployment fails visibly (ErrImageNeverPull) — never `latest`.
images:
  - name: srl-provider
    newTag: 4d48faa5e87d91f5409ac7be2781261b3839c7428d2d70bc0243828ad507d5e3
