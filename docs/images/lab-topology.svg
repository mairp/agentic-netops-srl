<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" font-family="Lato, Manrope, 'DejaVu Sans', sans-serif">
  <!--
    Source for docs/images/lab-topology.png, drawn in the predecessor's style (agentic-netops
    docs/images/lab-topology.svg, itself after srl-labs/srl-telemetry-lab): slate canvas, navy
    routers with the four-arrow L3 glyph, grey fabric links with port badges, and a green
    management network with each node's mgmt-ipv4 suffix. Every node, port and address is
    lab/topology.clab.yml's: badges are the SR Linux port numbers (ethernet-1/N).
    Render: rsvg-convert -w 1860 docs/images/lab-topology.svg -o docs/images/lab-topology.png
  -->
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <!-- L3 switch glyph: navy square with four L-shaped arrows, chevron heads, 90-degree symmetry -->
    <g id="arm" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M-36,-7 H-7 V-36"/>
      <path d="M-15,-26 L-7,-36 L1,-26"/>
    </g>
    <g id="router">
      <rect x="-48" y="-48" width="96" height="96" fill="#001135"/>
      <use href="#arm"/>
      <use href="#arm" transform="rotate(90)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(270)"/>
    </g>
    <!-- client laptop -->
    <g id="laptop">
      <rect x="-40" y="-30" width="80" height="52" rx="5" fill="#fff"/>
      <rect x="-34" y="-24" width="68" height="40" rx="2" fill="#001135"/>
      <path d="M-52,22 H52 L44,32 H-44 Z" fill="#fff"/>
      <rect x="-12" y="26" width="24" height="3" fill="#001135"/>
    </g>
    <!-- port badge -->
    <g id="port">
      <circle r="14" fill="#4bdd33"/>
    </g>
  </defs>

  <!-- outer frame like a draw.io export -->
  <rect x="0" y="0" width="1240" height="960" fill="#fff"/>
  <rect x="24" y="24" width="1192" height="912" fill="#4d5766" filter="url(#shadow)"/>

  <!-- ===== management network (top): the owned Docker network agentic-netops-mgmt ===== -->
  <text x="48" y="135" fill="#fff" font-size="28">mgmt net</text>
  <text x="48" y="163" fill="#4bdd33" fill-opacity="0.85" font-family="'DejaVu Sans Mono', monospace" font-size="16">172.25.25.0/24</text>
  <rect x="192" y="121" width="978" height="8" rx="4" fill="#4bdd33"/>

  <!-- ===== management network (bottom) ===== -->
  <text x="48" y="905" fill="#fff" font-size="28">mgmt net</text>
  <rect x="192" y="891" width="978" height="8" rx="4" fill="#4bdd33"/>

  <!-- ===== mgmt links (dashed green) ===== -->
  <g stroke="#4bdd33" stroke-width="2" stroke-dasharray="7 7" stroke-opacity="0.6" fill="none">
    <path d="M382,280 H350 V125"/>
    <path d="M858,280 H890 V125"/>
    <path d="M242,530 H210 V125"/>
    <path d="M998,530 H1030 V125"/>
    <path d="M342,790 H420 V895"/>
    <path d="M898,790 H820 V895"/>
  </g>
  <g fill="#4bdd33" fill-opacity="0.85" font-family="'DejaVu Sans Mono', monospace" font-size="17">
    <text x="343" y="272" text-anchor="end">.11</text>
    <text x="897" y="272">.12</text>
    <text x="203" y="522" text-anchor="end">.21</text>
    <text x="1037" y="522">.22</text>
    <text x="364" y="782">.31</text>
    <text x="876" y="782" text-anchor="end">.32</text>
  </g>
  <g fill="#4bdd33" fill-opacity="0.8" stroke="#3a4352" stroke-width="1.5">
    <circle cx="350" cy="125" r="4"/><circle cx="890" cy="125" r="4"/>
    <circle cx="210" cy="125" r="4"/><circle cx="1030" cy="125" r="4"/>
    <circle cx="420" cy="895" r="4"/><circle cx="820" cy="895" r="4"/>
  </g>

  <!-- ===== fabric links (grey): leafNN e1-49 -> spine01 e1-N, leafNN e1-50 -> spine02 e1-N ===== -->
  <g stroke="#828c99" stroke-width="3" fill="none">
    <line x1="412" y1="330" x2="272" y2="480"/>
    <line x1="448" y1="330" x2="932" y2="480"/>
    <line x1="792" y1="330" x2="308" y2="480"/>
    <line x1="828" y1="330" x2="968" y2="480"/>
    <!-- leaf01 e1-1 - client01 eth1 (VLAN-tagged services) -->
    <path d="M290,580 V722"/>
    <!-- leaf02 e1-1 - client02 eth1 (tagged), leaf02 e1-2 - client02 eth2 (the untagged port) -->
    <path d="M932,580 V722"/>
    <path d="M968,580 V722"/>
  </g>
  <g fill="#c9d1db" font-size="15" font-style="italic">
    <text x="302" y="662">tagged</text>
    <text x="920" y="662" text-anchor="end">tagged</text>
    <text x="980" y="662">untagged</text>
  </g>

  <!-- ===== spines ===== -->
  <text x="430" y="196" fill="#fff" font-size="30" text-anchor="middle">spine01</text>
  <text x="430" y="220" fill="#c9d1db" font-size="15" text-anchor="middle">ixr-d3l · RR</text>
  <use href="#router" x="430" y="280"/>
  <text x="810" y="196" fill="#fff" font-size="30" text-anchor="middle">spine02</text>
  <text x="810" y="220" fill="#c9d1db" font-size="15" text-anchor="middle">ixr-d3l · RR</text>
  <use href="#router" x="810" y="280"/>

  <!-- ===== leaves ===== -->
  <use href="#router" x="290" y="530"/>
  <text x="356" y="540" fill="#fff" font-size="30">leaf01</text>
  <text x="356" y="564" fill="#c9d1db" font-size="15">ixr-d2l</text>
  <use href="#router" x="950" y="530"/>
  <text x="884" y="540" fill="#fff" font-size="30" text-anchor="end">leaf02</text>
  <text x="884" y="564" fill="#c9d1db" font-size="15" text-anchor="end">ixr-d2l</text>

  <!-- ===== fabric label ===== -->
  <g font-family="'DejaVu Sans Mono', monospace" font-size="15" fill="#c9d1db" text-anchor="middle">
    <text x="620" y="455">eBGP underlay (dual-stack)</text>
    <text x="620" y="477">iBGP EVPN / VXLAN overlay</text>
  </g>

  <!-- ===== clients ===== -->
  <g fill="#fff" font-size="26" text-anchor="middle">
    <use href="#laptop" x="290" y="760"/><text x="290" y="835">client01</text>
    <use href="#laptop" x="950" y="760"/><text x="950" y="835">client02</text>
  </g>
  <g fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">
    <text x="290" y="762">EVPN</text>
    <text x="950" y="762">EVPN</text>
  </g>

  <!-- ===== port badges (SR Linux ethernet-1/N) ===== -->
  <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
    <use href="#port" x="412" y="330"/><text x="412" y="335">1</text>
    <use href="#port" x="448" y="330"/><text x="448" y="335">2</text>
    <use href="#port" x="792" y="330"/><text x="792" y="335">1</text>
    <use href="#port" x="828" y="330"/><text x="828" y="335">2</text>
    <use href="#port" x="272" y="480"/><text x="272" y="485">49</text>
    <use href="#port" x="308" y="480"/><text x="308" y="485">50</text>
    <use href="#port" x="290" y="580"/><text x="290" y="585">1</text>
    <use href="#port" x="932" y="480"/><text x="932" y="485">49</text>
    <use href="#port" x="968" y="480"/><text x="968" y="485">50</text>
    <use href="#port" x="932" y="580"/><text x="932" y="585">1</text>
    <use href="#port" x="968" y="580"/><text x="968" y="585">2</text>
  </g>
  <!-- client interface pills -->
  <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="267" y="712" width="46" height="20" rx="5" fill="#4bdd33"/><text x="290" y="727">eth1</text>
    <rect x="907" y="712" width="44" height="20" rx="5" fill="#4bdd33"/><text x="929" y="727">eth1</text>
    <rect x="953" y="712" width="44" height="20" rx="5" fill="#4bdd33"/><text x="975" y="727">eth2</text>
  </g>
</svg>
