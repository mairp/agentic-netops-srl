# schema-mirror lighttpd — git smart HTTP, upload-pack only (read-only), one project root.
server.modules = ("mod_access", "mod_alias", "mod_setenv", "mod_cgi")
server.port = 8080
server.document-root = "/srv/git"
server.upload-dirs = ("/tmp")
server.errorlog = "/dev/stderr"
# Nothing is ever pushed: receive-pack is refused before git-http-backend is reached, and the
# repository also carries http.receivepack=false.
$HTTP["url"] =~ "git-receive-pack" { url.access-deny = ("") }
alias.url = ("/git" => "/usr/libexec/git-core/git-http-backend")
$HTTP["url"] =~ "^/git" {
  cgi.assign = ("" => "")
  setenv.add-environment = ("GIT_PROJECT_ROOT" => "/srv/git", "GIT_HTTP_EXPORT_ALL" => "1")
}
