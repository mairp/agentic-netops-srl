apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider
  namespace: agentic-netops-system
spec:
  template:
    spec:
      automountServiceAccountToken: true
      containers:
        - name: manager
          image: example.invalid/manager:v0.1.0
          env:
            - name: DEVICE_PASSWORD           # the same credential, behind a secretKeyRef
              valueFrom:
                secretKeyRef:
                  name: device-credentials
                  key: password
          args: ["--password-file=/var/run/credentials/password", "--leader-elect"]
          volumeMounts:
            - name: credentials
              mountPath: /var/run/credentials
      volumes:
        - name: credentials                   # a projected volume
          projected:
            sources:
              - secret:
                  name: device-credentials
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
---
apiVersion: v1
kind: Secret
metadata:
  name: device-credentials
stringData:
  username: admin
  password: "${DEVICE_PASSWORD}"             # a generator placeholder, filled at provisioning
