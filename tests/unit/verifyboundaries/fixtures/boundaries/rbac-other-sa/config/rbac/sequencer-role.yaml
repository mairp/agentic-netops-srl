apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-writer
  namespace: agentic-netops-services
rules:
  - apiGroups: ["config.sdcio.dev"]
    resources: ["configs"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-writer
  namespace: agentic-netops-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-writer
subjects:
  - kind: ServiceAccount
    name: fabric-sequencer
    namespace: agentic-netops-system
