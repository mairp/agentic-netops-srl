apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  template:
    spec:
      containers:
        - name: grafana
          image: example.invalid/grafana:v12.0.0
          env:
            - name: GF_INSTALL_PLUGINS
              value: "grafana-clock-panel 2.1.8,nokia-topology-panel 1.0.4"
