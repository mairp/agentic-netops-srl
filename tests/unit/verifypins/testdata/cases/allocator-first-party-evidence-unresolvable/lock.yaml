# Host-side tooling (data-model.md §28, AD-21). Versions are recorded by
# `resolve_pins.sh --host-tooling` from what it observes; an empty value was not observed and
# `verify_pins.sh --host-tooling` fails on it.
hostTooling:
  browserAutomation:
    package: playwright
    version: "1.63.0" # recorded from lockFile; must equal pyproject's exact pin
    pyproject: agents/pyproject.toml
    lockFile: agents/uv.lock
    browser: chromium
    browserRevision: "1243" # the chromium revision the locked package version fixes
  capture:
    - tool: ffmpeg
      version: "7.1.5-0+deb13u1"
    - tool: Xvfb
      version: "21.1.16"
# First-party images (data-model.md §26, AD-05). Built locally, tagged <name>:<contentHash>,
