# versions.lock.yaml — the one compatibility manifest (C-01, NFR-003, data-model.md §23, §26, §28).
#
# Provenance rules (enforced by `make verify-pins` = scripts/lib/verify_pins.sh):
#   * The only digests and commits typed by hand are the ones the specification quotes
#     (tasks.md T008, contracts/crd-api.md "Version contract"): the SR Linux image, the YANG-model
#     tag commit, the deviation-patch commit, the three device-configuration images and the
#     kuid-server image. Every other digest, commit, checksum and hash below was written by
#     scripts/lib/resolve_pins.sh — image digests from the registry, commits from the repository,
#     release-asset checksums from the release's own checksum file, the plugin package hash from
#     grafana.com, dependency-lock hashes computed from the tree, host-tooling versions observed on
#     the host. A field resolve_pins.sh has not filled is left empty and the pin check fails on it.
#   * Tags are exact releases (MAJOR.MINOR.PATCH…): no `latest`, no floating minor, no branch.
#     `track:` only records the line a tag was resolved from (e.g. node's `20-alpine`); the pin is
#     the exact `tag:` plus `digest:`.
#   * `pinned:` is `<repository>:<tag>@<digest>`, written by resolve_pins.sh from the three fields
#     beside it; verify_pins.sh checks that it agrees with them.
#   * There is no exception field. The one pin exception NFR-003 admits is the recorded allocator
#     substitution (allocationAuthority, FR-104, AD-12); any other exception-, allow- or skip-style
#     key anywhere in this file fails the check.
#   * First-party images are built locally and have no registry digest; none is recorded (AD-05).
#     What is pinned is their build inputs: every FROM by digest and every dependency lock by hash.
lockVersion: 1
# Recorded from go.mod (T002 selected it; AD-50) — never chosen here.
goToolchain:
  source: go.mod
  go: "1.25.0"
  toolchain: "go1.27.1"
