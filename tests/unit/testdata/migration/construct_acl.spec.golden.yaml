spec:
  description: Service 5c8a2e4f6b1d3a7 (acl)
  accessLists:
  - name: acl-5c8a2e4f6b1d3a7-ingress
    stage: ingress
    type: ipv4
    defaultAction: deny
    rules:
    - name: allow-https
      priority: 100
      action: permit
      protocol: tcp
      sourcePrefix: 10.0.0.0/24
      destinationPort: "443"
      description: operator https allowance
    - name: allow-dns
      priority: 200
      action: permit
      protocol: udp
      destinationPort: "53"
  attachments:
  - node: leaf01
    attachment: ethernet-1/1
    vlan: 100
  - node: leaf02
    attachment: ethernet-1/1
    vlan: 100
